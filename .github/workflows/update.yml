name: Update MIFA subscription

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fresh subscription
        id: fetch
        run: python3 update_mifa.py

      - name: Commit if changed
        run: |
          git add mifa.txt mifa[0-9]*.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "mifa-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update MIFA subscription $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
